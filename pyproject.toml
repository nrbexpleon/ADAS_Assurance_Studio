[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adas-assurance-studio"
version = "0.1.0"
description = "Deterministic ADAS perception, fusion, ODD and scenario assurance workbench"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary - All Rights Reserved"}
dependencies = []

[project.scripts]
adas-assurance = "adas_assurance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]
